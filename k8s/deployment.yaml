
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp272-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mp272-api
  template:
    metadata:
      labels:
        app: mp272-api
    spec:
      containers:
        - name: mp272-api
          image: mp272-tea-leaf:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
